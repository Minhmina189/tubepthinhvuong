{% extends "base.html" %}
{% block title %}Nhập Đơn Hàng Thủ Công - Nam An{% endblock %}

{% block content %}
<div class="card">
  <h2>✏️ Nhập Đơn Hàng Thủ Công</h2>
  <p style="color:#555; margin-bottom:20px; font-size:.9rem;">
    Nhập từng dòng sản phẩm. Nhấn <strong>+ Thêm dòng</strong> để thêm sản phẩm mới.
  </p>

  <form method="POST" action="/manual_submit" id="manualForm">
    <div id="rows">
      <!-- JS will render initial row -->
    </div>

    <div style="margin-top:12px;">
      <button type="button" class="btn btn-outline btn-sm" onclick="addRow()">
        ➕ Thêm dòng
      </button>
    </div>

    <div style="margin-top:24px; display:flex; gap:12px;">
      <button type="submit" class="btn btn-primary" style="font-size:1rem; padding:11px 28px;">
        🚀 Báo Giá Ngay
      </button>
      <a href="{{ url_for('index') }}" class="btn btn-outline">← Upload File</a>
    </div>
  </form>
</div>

<script>
const MAT_OPTIONS = [
  { value: '',                label: '— Không rõ —',      group: '' },
  { value: 'Inox 304',        label: 'Inox 304',           group: 'Inox' },
  { value: 'Inox 201',        label: 'Inox 201',           group: 'Inox' },
  { value: 'Inox 316',        label: 'Inox 316',           group: 'Inox' },
  { value: 'Thép 8.8 đen',   label: 'Thép 8.8 đen',      group: 'Thép đen' },
  { value: 'Thép 10.9 đen',  label: 'Thép 10.9 đen',     group: 'Thép đen' },
  { value: 'Thép 12.9 đen',  label: 'Thép 12.9 đen',     group: 'Thép đen' },
  { value: 'Thép mạ kẽm 8.8',  label: 'Thép mạ kẽm 8.8',  group: 'Mạ kẽm' },
  { value: 'Thép mạ kẽm 10.9', label: 'Thép mạ kẽm 10.9', group: 'Mạ kẽm' },
  { value: 'Thép mạ kẽm 12.9', label: 'Thép mạ kẽm 12.9', group: 'Mạ kẽm' },
];

function buildMatSelect(name, selectedVal) {
  const groups = {};
  MAT_OPTIONS.forEach(o => {
    if (!groups[o.group]) groups[o.group] = [];
    groups[o.group].push(o);
  });
  let html = `<select name="${name}" style="padding:7px 8px; border:1.5px solid #c8d6e5; border-radius:5px; font-size:.85rem; width:100%; background:#fff;">`;
  Object.entries(groups).forEach(([grp, opts]) => {
    if (grp) html += `<optgroup label="${grp}">`;
    opts.forEach(o => {
      html += `<option value="${o.value}"${o.value === selectedVal ? ' selected' : ''}>${o.label}</option>`;
    });
    if (grp) html += `</optgroup>`;
  });
  html += '</select>';
  return html;
}

let rowCount = 0;

function addRow(name='', mat='', qty=1, note='') {
  rowCount++;
  const container = document.getElementById('rows');
  const div = document.createElement('div');
  div.id = 'row_' + rowCount;
  div.style.cssText = 'display:grid; grid-template-columns:2fr 1.5fr 80px 1.5fr 36px; gap:8px; margin-bottom:8px; align-items:center;';
  div.innerHTML = `
    <input type="text" name="name[]" placeholder="Tên sản phẩm (VD: Bu lông M10x30)"
           value="${name}" required
           style="padding:8px 10px; border:1.5px solid #c8d6e5; border-radius:5px; font-size:.88rem;">
    ${buildMatSelect('material[]', mat)}
    <input type="number" name="qty[]" placeholder="SL" value="${qty}" min="1"
           style="padding:8px 10px; border:1.5px solid #c8d6e5; border-radius:5px; font-size:.88rem; text-align:center;">
    <input type="text" name="note_in[]" placeholder="Ghi chú"
           value="${note}"
           style="padding:8px 10px; border:1.5px solid #c8d6e5; border-radius:5px; font-size:.88rem;">
    <button type="button" onclick="removeRow('row_${rowCount}')"
            style="background:#fde8e8; color:#c0392b; border:none; border-radius:5px;
                   width:34px; height:34px; cursor:pointer; font-size:1rem;">✕</button>
  `;
  container.appendChild(div);
}

function removeRow(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// Header row
const header = document.createElement('div');
header.style.cssText = 'display:grid; grid-template-columns:2fr 1.5fr 80px 1.5fr 36px; gap:8px; margin-bottom:6px;';
header.innerHTML = `
  <label style="font-size:.82rem; font-weight:700; color:#555;">Tên sản phẩm *</label>
  <label style="font-size:.82rem; font-weight:700; color:#555;">Chất liệu</label>
  <label style="font-size:.82rem; font-weight:700; color:#555; text-align:center;">SL</label>
  <label style="font-size:.82rem; font-weight:700; color:#555;">Ghi chú</label>
  <span></span>
`;
document.getElementById('rows').before(header);

// Default rows matching the sample quotation
const defaultRows = [
  ['Đệm phẳng M14', 'Inox 304', 6, ''],
  ['Đệm vênh M14', 'Inox 304', 6, ''],
  ['Bu lông M14x40', 'Thép mạ kẽm 8.8', 4, ''],
  ['Bu lông M10x55', 'Thép mạ kẽm 8.8', 16, ''],
  ['Đệm vênh M10', 'Inox 304', 70, ''],
  ['Đệm phẳng M10', 'Inox 304', 70, ''],
];
defaultRows.forEach(r => addRow(...r));
</script>
{% endblock %}
